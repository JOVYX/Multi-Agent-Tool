services:
  - type: web
    name: multitool-agent
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SEARCH_API_KEY
        sync: false
      - key: SEARCH_PROVIDER
        value: tavily
      - key: LOG_LEVEL
        value: INFO

